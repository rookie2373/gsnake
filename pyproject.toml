[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsnake"
dynamic = ["version"]
description = "Nokia 3310 snake game with colours"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.5.0"
]

[tool.hatch.version]
path = "src/gsnake/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gsnake"]

[project.scripts]
gsnake = "gsnake.main:main"